<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Guesser</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 4'%3E%3Crect width='4' height='4' fill='%230f1115'/%3E%3Crect x='1' y='0' width='1' height='1' fill='%23f5c518'/%3E%3Crect x='2' y='1' width='1' height='1' fill='%23f5c518'/%3E%3Crect x='0' y='2' width='1' height='1' fill='%233ecf8e'/%3E%3Crect x='3' y='3' width='1' height='1' fill='%23ff5c5c'/%3E%3Crect x='1' y='2' width='2' height='1' fill='%238a91a3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Movie Guesser</h1>
      <div class="stats">
        <span id="cat"></span>
        <span>Runda <b id="round">–</b></span>
        <span>Wynik <b id="score">0</b></span>
      </div>
    </header>

    <section class="stage menu">
      <canvas id="screen" width="960" height="540"></canvas>
      <canvas id="ghost" aria-hidden="true"></canvas>
      <div class="overlay" id="overlay"></div>
      <div class="level">
        <div class="level-bar"><div id="level-fill"></div></div>
        <span id="level-label"></span>
      </div>
    </section>

    <ul class="hints" id="hints"></ul>

    <section class="guess" id="guess-area">
      <div class="combo">
        <input id="guess" type="text" autocomplete="off" spellcheck="false"
               placeholder="Wpisz tytuł filmu…" aria-autocomplete="list" aria-controls="suggestions">
        <ul id="suggestions" role="listbox" hidden></ul>
      </div>
      <button id="skip" type="button" title="Przejdź od razu do wyraźniejszego obrazu (mniej punktów)">Wyraźniej</button>
    </section>

    <p class="feedback" id="feedback"></p>
    <ul class="history" id="history"></ul>

    <footer class="credit">
      Dane i kadry: <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
      Ta gra korzysta z API TMDB, ale nie jest wspierana ani certyfikowana przez TMDB.
    </footer>
  </main>

  <script src="config.js"></script>
  <script src="tmdb.js"></script>
  <script src="categories.js"></script>
  <script src="movies.js"></script>
  <script src="game.js"></script>
</body>
</html>
